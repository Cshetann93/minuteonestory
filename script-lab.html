<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Write screenplay scenes directly in your browser with Script Lab by MinuteOneStory.">
<title>Script Lab | MinuteOneStory</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--dark:#0f172a;--gray:#1e293b}
body{background:var(--dark);color:white;font-family:'Courier Prime',monospace;display:flex;min-height:100vh;margin:0;flex-direction:row}
#controls{width:340px;background:var(--gray);padding:20px;border-right:2px solid var(--gold);overflow-y:auto}
#paper{flex-grow:1;background:#edf4ff;color:#0b1120;padding:40px;overflow-y:auto}
.btn{background:transparent;border:1px solid var(--gold);color:var(--gold);width:100%;padding:12px;margin-bottom:10px;cursor:pointer;font-family:'Courier Prime',monospace;border-radius:10px}
.btn:hover{background:var(--gold);color:black}
.definition{font-size:.75rem;color:#94a3b8;margin:0 0 18px;font-style:italic;line-height:1.5}
.slugline{font-weight:bold;text-transform:uppercase;margin-top:25px}.action{margin-top:15px}.character{text-align:center;width:50%;margin:20px auto 0;text-transform:uppercase}.parenthetical{text-align:center;width:40%;margin:0 auto;font-size:.9rem}.dialogue{text-align:center;width:70%;margin:0 auto 15px}.transition{text-align:right;text-transform:uppercase;margin-top:15px;font-weight:bold}.shot{text-transform:uppercase;margin-top:15px;font-weight:bold}.note{font-style:italic;color:#334155;margin-top:15px;background:rgba(0,0,0,.05);padding:8px;border-left:3px solid var(--gold)}
@media(max-width:768px){body{flex-direction:column}#controls{width:100%;border-right:none;border-bottom:2px solid var(--gold)}#paper{padding:24px}.character,.dialogue,.parenthetical{width:100%}}
@media print{#controls{display:none}#paper{background:white;color:black}}
</style>
</head>
<body>
<div id="controls">
<h2 style="color:var(--gold)">Script Lab</h2>
<p style="color:#cbd5e1">Build screenplay scenes directly in your browser.</p>
<hr style="border:.5px solid var(--gold);opacity:.5;margin:20px 0">
<button class="btn" onclick="addBlock('slugline')">+ Add Slugline</button>
<button class="btn" onclick="addBlock('action')">+ Add Action</button>
<button class="btn" onclick="addBlock('shot')">+ Add Shot</button>
<button class="btn" onclick="addBlock('character')">+ Add Character</button>
<button class="btn" onclick="addBlock('parenthetical')">+ Add Parenthetical</button>
<button class="btn" onclick="addBlock('dialogue')">+ Add Dialogue</button>
<button class="btn" onclick="addBlock('transition')">+ Add Transition</button>
<button class="btn" onclick="addBlock('note')">+ Add Writer Note</button>
<button class="btn" onclick="saveDraft()">💾 Save Draft</button>
<button class="btn" onclick="clearDraft()">🗑️ Clear Draft</button>
<button class="btn" onclick="window.print()">🖨️ Export PDF</button>
<a href="/contact.html" style="display:block;text-align:center;margin-top:20px;color:var(--gold)">Need a professional screenplay?</a>
</div>
<div id="paper" contenteditable="true"></div>
<script>
const defaults=`<div class='slugline'>INT. MINUTE ONE LAB - DAY</div><div class='action'>The cursor blinks on a screenplay editor waiting for the next great story.</div><div class='character'>CREATOR</div><div class='dialogue'>Every great film starts with one scene.</div>`;
const paper=document.getElementById('paper');
paper.innerHTML=localStorage.getItem('scriptlabDraft')||defaults;
function addBlock(type){const block=document.createElement('div');block.className=type;const text={slugline:'INT. LOCATION - TIME',action:'Describe the visual action here.',character:'CHARACTER NAME',parenthetical:'(emotion)',dialogue:'Dialogue goes here.',transition:'CUT TO:',shot:'CLOSE ON:',note:'[Writer note or AI prompt]'};block.innerText=text[type];paper.appendChild(block);}
function saveDraft(){localStorage.setItem('scriptlabDraft',paper.innerHTML);alert('Draft saved locally on your device.');}
function clearDraft(){if(confirm('Clear the current draft?')){localStorage.removeItem('scriptlabDraft');paper.innerHTML=defaults;}}
</script>
</body>
</html>
