<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Contact MinuteOneStory for screenplay writing, YouTube storytelling, Instagram Reels scripts, and cinematic short film writing.">
<title>Contact Us | MinuteOneStory</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen">
<div class="max-w-5xl mx-auto px-6 py-16">
<h1 class="text-5xl font-extrabold text-white mb-6">Let's craft your next <span class="text-amber-400">viral story.</span></h1>
<p class="text-slate-400 mb-10 text-lg">Tell us about your project and your email app will open with everything pre-filled.</p>
<form id="contactForm" class="space-y-5 bg-slate-900 p-8 rounded-3xl border border-slate-800">
<input id="name" type="text" required placeholder="Your Name" class="w-full rounded-xl px-5 py-4 bg-slate-950 border border-slate-700 text-white">
<input id="email" type="email" required placeholder="Your Email" class="w-full rounded-xl px-5 py-4 bg-slate-950 border border-slate-700 text-white">
<select id="project" class="w-full rounded-xl px-5 py-4 bg-slate-950 border border-slate-700 text-white">
<option>Instagram Reels / Youtube Shorts</option>
<option>YouTube Long-Form Storytelling</option>
<option>Screenplay / Short Film</option>
<option>Other Creative Project</option>
</select>
<textarea id="message" rows="5" required placeholder="Project details..." class="w-full rounded-xl px-5 py-4 bg-slate-950 border border-slate-700 text-white"></textarea>
<button type="submit" class="w-full bg-amber-400 text-black font-bold py-4 rounded-xl hover:bg-amber-500 transition">Send Inquiry</button>
</form>
</div>
<script>
document.getElementById('contactForm').addEventListener('submit', function(e){
e.preventDefault();
const name=document.getElementById('name').value;
const email=document.getElementById('email').value;
const project=document.getElementById('project').value;
const message=document.getElementById('message').value;
const subject=encodeURIComponent('New Project Inquiry - '+project);
const body=encodeURIComponent('Name: '+name+'\nEmail: '+email+'\nProject: '+project+'\n\n'+message);
window.location.href='mailto:minuteonestory@gmail.com?subject='+subject+'&body='+body;
});
</script>
</body>
</html>
