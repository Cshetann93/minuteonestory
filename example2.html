<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DraftsRush - 2 Reel Frames</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #111317;
      color: #111317;
      padding: 30px;
    }
    .brand-font { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace, Courier; }

    /* Exact 9:16 display (405x720) -> Renders to 1080x1920 */
    .reel-frame {
      width: 405px;
      height: 720px;
      position: relative;
      flex-shrink: 0;
      border: 4px solid #111317;
      box-shadow: 10px 10px 0px #000000;
      background-color: #FFE600;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;
    }

    .b-card {
      border: 3.5px solid #111317;
      box-shadow: 6px 6px 0px #111317;
      background-color: #FFFFFF;
      padding: 24px;
      width: 100%;
    }
    .b-card-dark {
      border: 3.5px solid #111317;
      box-shadow: 6px 6px 0px #111317;
      background-color: #111317;
      padding: 32px 24px;
      width: 100%;
    }
    .b-card-sm {
      border: 2.5px solid #111317;
      box-shadow: 3.5px 3.5px 0px #111317;
    }

    .badge-pill {
      display: inline-block;
      background-color: #FFE600;
      color: #111317;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 11px;
      padding: 4px 10px;
      line-height: 14px;
      margin-bottom: 16px;
      border: 2px solid #111317;
    }

    .badge-pill-dark {
      display: inline-block;
      background-color: #111317;
      color: #FFFFFF;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 11px;
      padding: 4px 10px;
      line-height: 14px;
      margin-bottom: 16px;
      border: 2px solid #111317;
    }

    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .text-center { text-align: center; }
    .w-full { width: 100%; }
    .uppercase { text-transform: uppercase; }
  </style>
</head>
<body class="flex flex-col items-center justify-center">

  <!-- Download & Action Bar -->
  <div class="w-full max-w-4xl mb-8 flex flex-col sm:flex-row items-center justify-between gap-4 border-4 border-black p-5 b-card" style="background-color: #FFE600; margin-bottom: 32px;">
    <div>
      <h1 class="brand-font" style="font-weight: 900; font-size: 20px; text-transform: uppercase; letter-spacing: -0.025em;">2 Standalone Reel Frames</h1>
      <p class="font-mono" style="font-size: 11px; font-weight: 700; margin-top: 4px; color: #111317;">Yellow Anchor Canvas (1080x1920 Ready)</p>
    </div>
    <button id="download-btn" onclick="downloadAllFrames()" class="brand-font" style="background-color: #111317; color: #FFFFFF; font-weight: 900; font-size: 11px; text-transform: uppercase; border: 2px solid #111317; padding: 14px 24px; cursor: pointer; box-shadow: 4px 4px 0px #000000;">
      Download 2 Frames (PNG)
    </button>
  </div>

  <!-- Frames Container -->
  <div class="flex flex-wrap gap-8 justify-center items-center">

    <!-- FRAME 1: Yellow background, centered black box, refined copy -->
    <div id="frame-01" class="reel-frame">
      <div class="b-card-dark text-center">
        <div class="badge-pill">BEFORE YOU SCROLL</div>
        <h2 class="brand-font" style="font-weight: 900; font-size: 27px; line-height: 1.2; color: #FFFFFF; text-transform: uppercase; letter-spacing: -0.03em;">
          Let's turn your latest mistake into pure suspense.
        </h2>
      </div>
    </div>

    <!-- FRAME 2: Yellow background, CTA card -->
    <div id="frame-02" class="reel-frame">
      <div class="b-card text-center flex flex-col items-center">
        <div class="badge-pill-dark">YOUR TURN</div>
        <h2 class="brand-font" style="font-weight: 900; font-size: 26px; line-height: 1.2; color: #111317; text-transform: uppercase; letter-spacing: -0.03em; margin-bottom: 12px;">
          Built your own scene?
        </h2>
        <p style="font-size: 14px; font-weight: 700; color: #374151; line-height: 1.45; margin-bottom: 24px;">
          Send your draft to our DMs. We review community scripts and feature our favorites.
        </p>
        <div class="brand-font b-card-sm w-full" style="background-color: #111317; color: #FFE600; font-weight: 900; font-size: 12px; text-transform: uppercase; padding: 14px; border: 2px solid #111317;">
          DM US ON INSTAGRAM
        </div>
      </div>
    </div>

  </div>

  <script>
    async function downloadAllFrames() {
      const btn = document.getElementById('download-btn');
      btn.innerText = 'PREPARING FONTS...';
      btn.disabled = true;

      await document.fonts.ready;

      const pixelRatio = 1080 / 405;

      for (let i = 1; i <= 2; i++) {
        const frameId = `frame-0${i}`;
        const node = document.getElementById(frameId);
        btn.innerText = `EXPORTING FRAME ${i} OF 2...`;

        try {
          const dataUrl = await htmlToImage.toPng(node, {
            pixelRatio: pixelRatio,
            quality: 1.0,
            skipAutoScale: true,
            cacheBust: true,
            fontEmbedCSS: true
          });

          const link = document.createElement('a');
          link.download = `draftsrush-frame-0${i}.png`;
          link.href = dataUrl;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          await new Promise(r => setTimeout(r, 200));
        } catch (error) {
          console.error(`Failed rendering ${frameId}:`, error);
        }
      }

      btn.innerText = 'DOWNLOAD 2 FRAMES (PNG)';
      btn.disabled = false;
    }
  </script>
</body>
</html>
